name: Build Mod
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Matches your new wrapper version
          gradle-version: 8.11

      - name: Build Mod
        # This command triggers the 'cooking' process
        run: gradle build --no-daemon

      - name: Upload Artifact
        # This saves the finished .jar file for you to download
        uses: actions/upload-artifact@v4
        with:
          name: EnzoModKit-JAR
          path: build/libs/*.jar
          
